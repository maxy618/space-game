<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Exploration Game</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #16161d;
      color: #b7b7ff;
      font-family: 'Roboto Mono', monospace;
    }
    .fill {
      position: fixed;
      width: 100vw;
      height: 100vh;
    }
    .canvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .top-text {
      width: 100%;
      margin: 8px;
      pointer-events: none;
      font-size: 12px;
      font-family: 'Roboto Mono', monospace;
      position: fixed;
      top: 0;
      left: 0;
      color: #b7b7ff;
    }
    .bottom-text {
      width: 100%;
      margin: 8px;
      pointer-events: none;
      font-size: 12px;
      font-family: 'Roboto Mono', monospace;
      position: fixed;
      bottom: 0;
      left: 0;
      color: #b7b7ff;
    }
    .loading {
      margin: 8px;
      color: #b7b7ff;
    }
  </style>
</head>
<body>
  <div id="app" class="fill">
    <canvas id="canvasMain" class="canvas fill"></canvas>
    <pre id="topText" class="top-text" hidden></pre>
    <pre id="bottomText" class="bottom-text" hidden></pre>
    <div id="loading" class="loading">Loading...</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

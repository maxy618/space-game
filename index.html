<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Exploration Game — Android 15 Parity</title>
  <link rel="shortcut icon" type="image/svg+xml" href="/favicon15.svg" />
  <style>
    :root {
      --color-Eigengrau: #16161D;
      --color-Eigengrau2: #292936;
      --color-Eigengrau3: #3C3C4C;
      --color-Eigengrau4: #A7A7CA;
      --color-Console: #B7B7FF;
      --color-Autopilot: #4285F4;
      /* Phone safe areas (notch / cutout): UI must clear these zones. */
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--color-Eigengrau);
      color: var(--color-Console);
      font-family: 'Roboto Mono', monospace;
    }

    .fill {
      position: fixed;
      width: 100vw;
      height: 100vh;
    }

    .canvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .top-text {
      width: 100%;
      margin: 8px;
      pointer-events: none;
      font-size: 12px;
      font-family: 'Roboto Mono', monospace;
      position: fixed;
      top: calc(0px + var(--safe-top) * 0.5);
      left: 0;
      color: var(--color-Console);
    }

    .container-text {
      width: 100%;
      margin: 0;
      pointer-events: none;
      font-size: 11px;
      font-family: 'Roboto Mono', monospace;
      white-space: pre;
    }

    /* Player pause button (top-right). Same size as the boost button
       (user 2026-11-08). Bespoke SVG: two rounded bars with a negative-space
       orbit ring around them (original geometry, P06-T04). */
    #pauseButton {
      position: fixed;
      top: calc(14px + var(--safe-top));
      right: calc(14px + var(--safe-right));
      width: 56px;
      height: 56px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(22, 22, 29, 0.72);
      border: 1px solid var(--color-Eigengrau3);
      border-radius: 14px;
      cursor: pointer;
      z-index: 40;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    /* Pressed state: settle + brighter fill (game feel). */
    #pauseButton:active {
      transform: translateY(1px);
      background: rgba(60, 60, 76, 0.9);
      border-color: var(--color-Eigengrau4);
    }

    #pauseButton:hover {
      background: rgba(60, 60, 76, 0.85);
      border-color: var(--color-Eigengrau4);
    }

    /* Focus-visible ring for keyboard users. */
    #pauseButton:focus-visible {
      outline: 2px solid var(--color-Autopilot);
      outline-offset: 2px;
    }

    #pauseButton svg {
      display: block;
    }

    /* Boost burner: the ONE enlarged action button (user 2026-11-09: 84px,
       1.5× the other buttons) — primary gesture, thumb-reachable in the
       bottom-right corner, same monochrome geometry language as pause. */
    #boostButton {
      position: fixed;
      bottom: calc(24px + var(--safe-bottom));
      right: calc(14px + var(--safe-right));
      width: 84px;
      height: 84px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(22, 22, 29, 0.72);
      border: 1px solid var(--color-Eigengrau3);
      border-radius: 20px;
      cursor: pointer;
      z-index: 40;
      transition: background 0.15s, border-color 0.15s, opacity 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    #boostButton:active:not(:disabled) {
      transform: translateY(1px);
      background: rgba(60, 60, 76, 0.9);
      border-color: var(--color-Eigengrau4);
    }
    #boostButton.engaged {
      border-color: var(--color-Console);
      background: rgba(60, 60, 76, 0.92);
    }
    #boostButton:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }
    #boostButton svg { display: block; width: 40px; height: 40px; }

    /* Boost burner screen glow (user 2026-11-08, reworked 2026-11-09):
       a DYNAMIC flame-light rim in the burner's own color — no neon bar,
       the intensity breathes like exhaust flame. Shown only while boost
       thrust actually burns; opacity driven per frame from MainActivity15
       (layered irregular flicker), short cross-fade both ways. Pure HUD
       overlay, separate from the speed-based fisheye warp. */
    #boostGlow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      transition: opacity 0.14s linear;
      --boost-glow-rgb: 90, 190, 255;
      box-shadow:
        inset 0 0 70px rgba(var(--boost-glow-rgb), 0.34),
        inset 0 0 190px rgba(var(--boost-glow-rgb), 0.16);
    }
    #boostGlow.active { opacity: 1; }

    /* Impact warning (user 2026-11-09): restrained instrument banner in the
       shared HUD chrome — flat Eigengrau plate, 1 px accent border, no glow.
       Amber = warning (TTI ≤ 5 s), red = critical (≤ 3 s). */
    #impactWarning {
      position: fixed;
      top: calc(14px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      background: rgba(22, 22, 29, 0.82);
      border: 1px solid rgba(214, 164, 66, 0.55);
      border-radius: 12px;
      color: #D6A442;
      font-family: "Roboto Mono", monospace;
      font-size: 15px;
      letter-spacing: 0.06em;
      z-index: 35;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.18s ease, visibility 0s 0.18s;
      pointer-events: none;
      -webkit-tap-highlight-color: transparent;
    }
    #impactWarning.active {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.18s ease;
    }
    #impactWarning.critical {
      border-color: rgba(232, 72, 56, 0.7);
      color: #E84838;
    }
    #impactWarning.critical #impactWarningTime { font-weight: 700; }
    #impactWarning svg { display: block; }
    @media (prefers-reduced-motion: reduce) {
      #impactWarning { transition: opacity 0.01s linear, visibility 0s; }
    }

    /* Full-screen pause overlay with a frosted-glass blur, darkening and a
       subtle white pulse for atmosphere. Fades in smoothly (transition, not
       display toggling) — the same fade logic will be used for every menu. */
    #pauseMenu {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(10, 10, 16, 0.62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 50;
      user-select: none;
      -webkit-user-select: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.28s ease, visibility 0s linear 0.28s;
      overflow: hidden;
    }

    #pauseMenu.pause-open {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.28s ease;
    }

    /* Atmosphere: soft white pulses spawned by JS at random places and random
       times (asynchronous). They may sit partially off-screen on purpose. */
    .pause-pulse {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      --pulse-max: 1;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0) 66%);
      animation: pausePulseFade 2.8s ease-in-out forwards;
    }

    @keyframes pausePulseFade {
      0% { opacity: 0; transform: scale(0.7); }
      45% { opacity: calc(var(--pulse-max) * 1); transform: scale(1.06); }
      100% { opacity: 0; transform: scale(1.22); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pause-pulse { display: none; }
      #pauseMenu { transition: opacity 0.01s linear, visibility 0s; }
      #boostGlow { transition: opacity 0.01s linear; }
    }

    .pause-menu-title {
      font-size: 22px;
      letter-spacing: 8px;
      color: var(--color-Eigengrau4);
      margin: 0 0 18px 0;
    }

    .pause-menu-btn {
      width: 240px;
      padding: 12px;
      text-align: center;
      background: rgba(41, 41, 54, 0.85);
      border: 1px solid var(--color-Eigengrau3);
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 2px;
      font-size: 14px;
      transition: background 0.15s, border-color 0.15s;
    }

    .pause-menu-btn:hover {
      background: rgba(60, 60, 76, 0.95);
      border-color: var(--color-Eigengrau4);
    }

    #pauseContinue {
      border-color: var(--color-Autopilot);
    }

    .top-container {
      position: fixed;
      top: 0;
      left: 0;
      /* Hug the telemetry text: the collision logic for the pause button
         measures this box, so it must wrap tightly around the text. */
      width: fit-content;
      max-width: calc(100% - 70px);
      margin: 8px;
      pointer-events: none;
    }

    .bottom-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      margin: 8px;
      pointer-events: none;
    }

    .top-right-container {
      position: fixed;
      top: 0;
      right: 0;
      margin: 8px;
    }

    .bottom-right-container {
      position: fixed;
      bottom: 0;
      right: 0;
      margin: 8px;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s linear 0.2s, opacity 0.2s;
    }

    .bottom-right-container.controls-show {
      visibility: visible;
      opacity: 1;
      transition: visibility 0s linear 0s, opacity 0s;
    }

    .autopilot-button {
      padding: 8px;
      color: var(--color-Console);
      border: 1px solid var(--color-Eigengrau2);
      background: var(--color-Eigengrau2);
      border-radius: 4px;
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    .autopilot-button.autopilot-button-selected {
      background: var(--color-Autopilot);
      color: white;
    }

    .autopilot {
      color: var(--color-Autopilot);
      white-space: pre-wrap;
    }

    .loading {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      background: var(--color-Eigengrau);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Roboto Mono', monospace;
      font-size: 16px;
      color: var(--color-Console);
    }

    .loading[hidden] {
      display: none;
    }

    select, input[type="checkbox"], button {
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      color: var(--color-Console);
      background: var(--color-Eigengrau2);
      border: 1px solid var(--color-Eigengrau2);
    }

    label {
      font-size: 12px;
    }

    #speedContainerMask {
      background-color: rgba(0, 0, 0, 0.5);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
    }

    /* class selectors must win over the #speedContainerMask base rule */
    .speed-container-hide {
      display: none !important;
    }

    .speed-container-show {
      display: flex;
    }

    #speedContainer {
      background: var(--color-Eigengrau);
      border: 1px solid var(--color-Eigengrau2);
      padding: 16px;
      border-radius: 8px;
    }

    #speedContainerButton {
      text-align: center;
    }

    #speedIntegral, #speedDecimal {
      display: grid;
      gap: 4px;
    }

    #speedIntegral { grid-template-columns: repeat(6, 1fr); }
    #speedDecimal { grid-template-columns: repeat(6, 1fr); }

    #speedIntegral button, #speedDecimal button {
      font-size: 14px;
      padding: 8px;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <canvas id="canvasMain" class="canvas fill" hidden></canvas>

  <!-- Boost burner screen glow (driven per frame; see MainActivity15). -->
  <div id="boostGlow" aria-hidden="true"></div>

  <!-- Collision warning banner (driven per frame; see MainActivity15). -->
  <div id="impactWarning" role="alert" aria-live="assertive">
    <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M9 2 L16.5 15 H1.5 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="9" y1="6.5" x2="9" y2="10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="9" cy="12.8" r="0.9" fill="currentColor"/>
    </svg>
    <span>IMPACT</span>
    <span id="impactWarningTime">T−0.0s</span>
  </div>

  <div id="topContainer" class="top-container" hidden>
    <div id="topText" class="container-text"></div>
    <div id="autopilotText" class="container-text autopilot"></div>
  </div>

  <div id="bottomContainer" class="bottom-container" hidden>
    <div id="bottomText" class="container-text"></div>
  </div>

  <div id="rightContainer" class="bottom-right-container">
    <select id="zoomSelect">
      <option>Fixed</option>
      <option>Dynamic</option>
      <option>Manual</option>
    </select>
    <label>
      <input type="checkbox" id="pauseCheck" />
      Pause
    </label>
    <button id="speedButton">1x</button>
    <button id="autoPilotButton" class="autopilot-button">A</button>
  </div>

  <div id="loading" class="loading">Loading...</div>

  <!-- Player pause button: bespoke SVG (rounded bars ringed by a negative-
       space orbit arc — original geometry, no icon packs). -->
  <button id="pauseButton" type="button" aria-label="Pause">
    <svg width="28" height="28" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="11" cy="11" r="10.2" fill="none" stroke="#3C3C4C" stroke-width="1.4" stroke-dasharray="3.2 2.6" stroke-linecap="round"/>
      <rect x="6.6" y="5.4" width="3.2" height="11.2" rx="1.6" fill="#B7B7FF" />
      <rect x="12.2" y="5.4" width="3.2" height="11.2" rx="1.6" fill="#B7B7FF" />
    </svg>
  </button>

  <!-- Boost burner (user 2026-11-08): sits under the pause button, thumb-
       reachable in the top-right stack. Enabled only at/above the 4000
       cruise cap; pushes the cap to 6000 while held. Bespoke flame glyph. -->
  <button id="boostButton" type="button" aria-label="Boost">
    <svg width="26" height="26" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 21 C9.5 18.5 9 15.5 11.1 13 C10.2 13.6 8.6 13.4 7.9 12.3 C6.4 9.9 8.4 6.6 9.9 4.2 C10.6 6 12 7 13 6.4 C14.2 5.6 13.8 3.8 14 2.2 C16.2 4.3 18 7 17.9 11 C17.8 15.4 14.6 19.4 12 21 Z" fill="#B7B7FF" stroke="#3C3C4C" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M12 19 C10.8 17.4 10.6 15.4 12 13.6 C13.4 15.4 13.2 17.4 12 19 Z" fill="#16161D"/>
    </svg>
  </button>

  <div id="pauseMenu" hidden>
    <div class="pause-menu-title">PAUSED</div>
    <button id="pauseContinue" class="pause-menu-btn" type="button">CONTINUE</button>
    <button id="pauseSettings" class="pause-menu-btn" type="button">SETTINGS</button>
    <button id="pauseExit" class="pause-menu-btn" type="button">EXIT</button>
  </div>

  <div id="speedContainerMask" class="speed-container-hide">
    <div id="speedContainer">
      <table>
        <tr>
          <td id="speedContainerButton">
            <button id="butIntegral">1</button>
            <button id="butDecimal">.00</button>
          </td>
        </tr>
        <tr>
          <td>
            <div id="speedIntegral"></div>
          </td>
        </tr>
        <tr>
          <td>
            <div id="speedDecimal"></div>
          </td>
        </tr>
      </table>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>

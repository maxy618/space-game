<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Exploration Game вЂ” Android 15 Parity</title>
  <link rel="shortcut icon" type="image/svg+xml" href="/favicon15.svg" />
  <style>
    :root {
      --color-Eigengrau: #16161D;
      --color-Eigengrau2: #292936;
      --color-Eigengrau3: #3C3C4C;
      --color-Eigengrau4: #A7A7CA;
      --color-Console: #B7B7FF;
      --color-Autopilot: #4285F4;
      /* Phone safe areas (notch / cutout): UI must clear these zones. */
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--color-Eigengrau);
      color: var(--color-Console);
      font-family: 'Roboto Mono', monospace;
    }

    .fill {
      position: fixed;
      width: 100vw;
      height: 100vh;
    }

    .canvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .top-text {
      width: 100%;
      margin: 8px;
      pointer-events: none;
      font-size: 12px;
      font-family: 'Roboto Mono', monospace;
      position: fixed;
      top: calc(0px + var(--safe-top) * 0.5);
      left: 0;
      color: var(--color-Console);
    }

    .container-text {
      width: 100%;
      margin: 0;
      pointer-events: none;
      font-size: 11px;
      font-family: 'Roboto Mono', monospace;
      white-space: pre;
    }

    /* Player pause button (top-right). Same size as the boost button
       (user 2026-11-08). Bespoke SVG: two rounded bars with a negative-space
       orbit ring around them (original geometry, P06-T04). */
    #pauseButton {
      position: fixed;
      top: calc(14px + var(--safe-top));
      right: calc(14px + var(--safe-right));
      width: 56px;
      height: 56px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(22, 22, 29, 0.72);
      border: 1px solid var(--color-Eigengrau3);
      border-radius: 14px;
      cursor: pointer;
      z-index: 40;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    /* Pressed state: settle + brighter fill (game feel). */
    #pauseButton:active {
      transform: translateY(1px);
      background: rgba(60, 60, 76, 0.9);
      border-color: var(--color-Eigengrau4);
    }

    #pauseButton:hover {
      background: rgba(60, 60, 76, 0.85);
      border-color: var(--color-Eigengrau4);
    }

    /* Focus-visible ring for keyboard users. */
    #pauseButton:focus-visible {
      outline: 2px solid var(--color-Autopilot);
      outline-offset: 2px;
    }

    #pauseButton svg {
      display: block;
    }

    /* Safety system (user 2026-11-09): shield-A, above the radar button.
       Engaged look = boost-like highlight; intervention look = red. */
    #safeButton {
      position: fixed;
      right: calc(14px + var(--safe-right));
      bottom: calc(250px + var(--safe-bottom)); /* even 10px gaps in the stack: boost(24+84) → scan → radar → safe */
      width: 56px;
      height: 56px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(22, 22, 29, 0.72);
      border: 1px solid var(--color-Eigengrau3);
      border-radius: 14px;
      cursor: pointer;
      z-index: 40;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    #safeButton.engaged {
      /* like the boost burner when engaged: brighter fill, console border —
         NO green anywhere (user 2026-11-09) */
      border-color: var(--color-Console);
      background: rgba(60, 60, 76, 0.92);
      box-shadow: 0 0 10px rgba(183, 183, 255, 0.25);
    }
    #safeButton.hold {
      border-color: #ff8a6a;
      background: rgba(44, 22, 19, 0.92);
      box-shadow: 0 0 18px rgba(232, 84, 32, 0.5);
      animation: heatEdgePulse 0.9s ease-in-out infinite;
    }
    /* Red edge glow during the safety takeover (user 2026-11-09). */
    #safeEdge {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 41;
      opacity: 0;
      box-shadow: inset 0 0 110px 40px rgba(232, 48, 32, 0.55), inset 0 0 34px 8px rgba(255, 90, 70, 0.4);
      transition: opacity 0.25s ease;
    }
    #safeEdge.active {
      animation: heatEdgePulse 0.8s ease-in-out infinite;
    }
    /* Returned-control toast (safety system hand-back). */
    #safeToast {
      position: fixed;
      left: 50%;
      top: calc(150px + var(--safe-top));
      transform: translateX(-50%) translateY(-4px);
      padding: 7px 16px;
      font-family: "Roboto Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: #9ED8A4;
      background: rgba(22, 22, 29, 0.92);
      border: 1px solid #4E9E5F;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 42;
      white-space: nowrap;
    }
    #safeToast.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Landing assist button (user 2026-11-09): bottom-left, thumb range. */
    #landButton {
      position: fixed;
      left: calc(14px + var(--safe-left));
      bottom: calc(24px + var(--safe-bottom));
      width: 64px;
      height: 64px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(22, 22, 29, 0.72);
      border: 1px solid var(--color-Eigengrau3);
      border-radius: 16px;
      cursor: pointer;
      z-index: 40;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    #landButton:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    #landButton.armed {
      border-color: #9ED8A4;
      box-shadow: 0 0 12px rgba(110, 200, 130, 0.3);
    }
    #landButton svg { display: block; }

    /* Boost burner: the ONE enlarged action button (user 2026-11-09: 84px,
       1.5Г— the other buttons) вЂ” primary gesture, thumb-reachable in the
       bottom-right corner, same monochrome geometry language as pause. */
    #boostButton {
      position: fixed;
      bottom: calc(24px + var(--safe-bottom));
      right: calc(14px + var(--safe-right));
      width: 84px;
      height: 84px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(22, 22, 29, 0.72);
      border: 1px solid var(--color-Eigengrau3);
      border-radius: 20px;
      cursor: pointer;
      z-index: 40;
      transition: background 0.15s, border-color 0.15s, opacity 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    #boostButton:active:not(:disabled) {
      transform: translateY(1px);
      background: rgba(60, 60, 76, 0.9);
      border-color: var(--color-Eigengrau4);
    }
    #boostButton.engaged {
      border-color: var(--color-Console);
      background: rgba(60, 60, 76, 0.92);
    }
    #boostButton:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }
    #boostButton svg { display: block; width: 46px; height: 46px; }

    /* Boost burner screen glow (user 2026-11-08, reworked 2026-11-09):
       a DYNAMIC flame-light rim in the burner's own color вЂ” no neon bar,
       the intensity breathes like exhaust flame. Shown only while boost
       thrust actually burns; opacity driven per frame from MainActivity15
       (layered irregular flicker), short cross-fade both ways. Pure HUD
       overlay, separate from the speed-based fisheye warp. */
    #boostGlow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      transition: opacity 0.14s linear;
      --boost-glow-rgb: 90, 190, 255;
      box-shadow:
        inset 0 0 70px rgba(var(--boost-glow-rgb), 0.34),
        inset 0 0 190px rgba(var(--boost-glow-rgb), 0.16);
    }
    #boostGlow.active { opacity: 1; }

    /* Impact warning (user 2026-11-09): restrained instrument banner in the
       shared HUD chrome вЂ” flat Eigengrau plate, 1 px accent border, no glow.
       Amber = warning (TTI в‰¤ 5 s), red = critical (в‰¤ 3 s). */
    #impactWarning {
      position: fixed;
      top: calc(14px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      background: rgba(22, 22, 29, 0.82);
      border: 1px solid rgba(214, 164, 66, 0.55);
      border-radius: 12px;
      color: #D6A442;
      font-family: "Roboto Mono", monospace;
      font-size: 15px;
      letter-spacing: 0.06em;
      z-index: 35;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.18s ease, visibility 0s 0.18s;
      pointer-events: none;
      -webkit-tap-highlight-color: transparent;
    }
    #impactWarning.active {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.18s ease;
    }
    #impactWarning.critical {
      border-color: rgba(232, 72, 56, 0.7);
      color: #E84838;
    }
    #impactWarning.critical #impactWarningTime { font-weight: 700; }
    #impactWarning svg { display: block; }
    @media (prefers-reduced-motion: reduce) {
      #impactWarning { transition: opacity 0.01s linear, visibility 0s; }
    }

    /* Scan & radar buttons (user 2026-11-09): 56px, stacked above boost.
       Scan shows its cooldown as a conic sweep (driven from JS). */
    #scanButton, #radarButton {
      position: fixed;
      right: calc(14px + var(--safe-right));
      width: 56px;
      height: 56px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(22, 22, 29, 0.72);
      border: 1px solid var(--color-Eigengrau3);
      border-radius: 14px;
      cursor: pointer;
      z-index: 40;
      transition: background 0.15s, border-color 0.15s, opacity 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    #scanButton { bottom: calc(118px + var(--safe-bottom)); }
    #radarButton { bottom: calc(184px + var(--safe-bottom)); }
    #autoPilotButton {
      position: fixed;
      top: calc(84px + var(--safe-top)); /* РїРѕРґ РїР°СѓР·РѕР№ (user 2026-11-09) */
      right: calc(14px + var(--safe-right));
      width: 56px;
      height: 56px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(22, 22, 29, 0.72);
      border: 1px solid var(--color-Eigengrau3);
      border-radius: 14px;
      cursor: pointer;
      z-index: 40;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    #autoPilotButton:active { transform: translateY(1px); background: rgba(60,60,76,0.9); border-color: var(--color-Eigengrau4); }
    #autoPilotButton.engaged {
      border-color: #4E9E5F;
      background: rgba(46, 66, 52, 0.9);
    }
    #autoPilotButton.stopped {
      border-color: rgba(232, 72, 56, 0.7);
      background: rgba(66, 40, 40, 0.9);
    }
    #autoPilotButton svg { display: block; }
    #scanButton:active, #radarButton:active {
      transform: translateY(1px);
      background: rgba(60, 60, 76, 0.9);
      border-color: var(--color-Eigengrau4);
    }
    #scanButton:disabled { opacity: 0.38; cursor: not-allowed; }
    #radarButton.open {
      border-color: var(--color-Console);
      background: rgba(60, 60, 76, 0.92);
    }
    #scanButton svg, #radarButton svg { display: block; }

    /* Radar / system map overlay (user 2026-11-09): schematic view in the
       same visual language вЂ” dark plate, hairline orbits, glyph planets.
       Star-centered, fixed north-up; opens with a fade + slight scale. */
    #radarOverlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(4, 5, 8, 0.86);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 45;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0s 0.22s;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #radarOverlay.open {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.22s ease;
      pointer-events: auto;
    }
    #radarCanvas {
      width: min(78vmin, 460px);
      height: min(78vmin, 460px);
      margin-top: 64px; /* square sits lower: the info card band above it */
      background: rgba(22, 22, 29, 0.9);
      border: 1px solid var(--color-Eigengrau3);
      border-radius: 18px;
      cursor: crosshair;
      touch-action: none;
    }
    /* Radar close вњ• (user 2026-11-09 v2, refined: TOP-RIGHT, directly ABOVE
       the map square itself). THE only way to close the radar. */
    #radarClose {
      position: absolute;
      /* canvas top-right corner, shifted with the lowered square:
         close sits just above its top edge. */
      top: calc(50% - min(46vmin, 280px) - 22px);
      right: calc(50% - min(46vmin, 280px) + 4px);
      width: 42px;
      height: 42px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(22, 22, 29, 0.92);
      border: 1px solid var(--color-Eigengrau3);
      border-radius: 12px;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0s 0.22s;
      -webkit-tap-highlight-color: transparent;
    }
    #radarOverlay.open #radarClose {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.22s ease;
    }
    #radarClose:active {
      transform: translateY(1px);
      background: rgba(60, 60, 76, 0.9);
    }
    #radarClose svg { display: block; }
    /* Route bar: FOUR IDENTICAL SQUARE BUTTONS (user 2026-11-09 criterion):
       same size/border/typography; SVG icons only вЂ” no emoji/pictographs. */
    #routeBar {
      position: absolute;
      bottom: 26px;
      display: flex;
      gap: 12px;
    }
    .radar-square-btn {
      width: 56px;
      height: 56px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(22, 22, 29, 0.92);
      border: 1px solid var(--color-Eigengrau3);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .radar-square-btn:active {
      transform: translateY(1px);
      background: rgba(60, 60, 76, 0.9);
    }
    .radar-square-btn[disabled] {
      opacity: 0.4;
      cursor: default;
    }
    .radar-square-btn.mode-on {
      border-color: var(--color-Autopilot);
      background: rgba(30, 30, 44, 0.95);
      box-shadow: 0 0 0 2px rgba(183, 183, 255, 0.35), 0 0 18px rgba(183, 183, 255, 0.22);
      animation: modePulse 1.1s ease-in-out infinite;
    }
    /* delete mode looks exactly like add mode (user 2026-11-09) */
    .radar-square-btn.mode-on.del-mode {
      border-color: var(--color-Autopilot);
      background: rgba(30, 30, 44, 0.95);
      box-shadow: 0 0 0 2px rgba(183, 183, 255, 0.35), 0 0 18px rgba(183, 183, 255, 0.22);
    }
    @keyframes modePulse {
      0%, 100% { box-shadow: 0 0 0 2px rgba(183, 183, 255, 0.35), 0 0 18px rgba(183, 183, 255, 0.22); }
      50% { box-shadow: 0 0 0 2px rgba(183, 183, 255, 0.65), 0 0 26px rgba(183, 183, 255, 0.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      .radar-square-btn.mode-on { animation: none; }
    }
    .radar-square-btn.cancel-btn {
      border-color: #6E4E4E;
      background: rgba(44, 30, 30, 0.92);
    }
    .radar-square-btn.cancel-btn:active {
      background: rgba(70, 44, 40, 0.95);
      border-color: #a53a2a;
    }
    .radar-square-btn.go-btn {
      border-color: #4E9E5F;
      background: rgba(30, 44, 34, 0.92);
    }
    .radar-square-btn svg { display: block; }
    /* Scan hint / result banners: top-center console strips. */
    #scanHint, #scanResult, #heatBanner {
      position: fixed;
      top: calc(14px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      padding: 8px 16px;
      font-family: "Roboto Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--color-Console);
      background: rgba(22, 22, 29, 0.88);
      border: 1px solid var(--color-Eigengrau3);
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 42;
      white-space: nowrap;
    }
    #scanHint.active, #scanResult.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #scanHint { color: #D8A84E; }
    /* Void / edge warnings (user 2026-11-09): short centered cards under
       the top text; in the VOID the pulse is hard black, near the edge
       burgundy — escalate as you approach. */
    #voidBanner, #voidBannerNear {
      position: fixed;
      left: 50%;
      top: calc(150px + var(--safe-top));
      transform: translateX(-50%) translateY(-4px);
      max-width: max-content;
      padding: 7px 16px;
      font-family: "Roboto Mono", monospace;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.14em;
      line-height: 1.5;
      text-align: center;
      background: rgba(22, 22, 29, 0.94);
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 42;
    }
    #voidBanner span, #voidBannerNear span { display: block; }
    #voidBanner {
      color: #E8E8F2;
      border: 1px solid #4A4A5C;
    }
    #voidBannerNear {
      color: #D89A8A;
      border: 1px solid #6E3A3A;
    }
    #voidBanner.active, #voidBannerNear.near {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #voidBanner.active {
      animation: heatEdgePulse 1.2s ease-in-out infinite;
    }
    /* black pulsing edge (void / border dread) */
    #voidEdge {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 41;
      opacity: 0;
      box-shadow: inset 0 0 100px 22px rgba(0, 0, 0, 0.92), inset 0 0 44px 10px rgba(120, 30, 30, 0.55);
      transition: opacity 0.3s ease;
    }
    #voidEdge.active {
      animation: heatEdgePulse 1.3s ease-in-out infinite;
    }
    #scanResult { color: #9ED8A4; }
    #scanResult small { color: var(--color-Eigengrau4); }
    /* Scan results stack (user 2026-11-09): short cards, one per type,
       appearing sequentially under the top HUD text, never overlapping it. */
    #scanResults {
      position: fixed;
      left: 50%;
      top: calc(112px + var(--safe-top));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 42;
      pointer-events: none;
      transform: translateX(-50%);
    }
    .scan-result-row {
      padding: 6px 12px;
      font-family: "Roboto Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #9ED8A4;
      background: rgba(22, 22, 29, 0.92);
      border: 1px solid var(--color-Eigengrau3);
      border-radius: 8px;
      animation: scanRowIn 0.3s ease both;
    }
    @keyframes scanRowIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scan-result-row { animation: none; }
    }
    /* Stellar heat card: amber approach / red countdown — SAME small-card
       style as the scan stack (user 2026-11-09): compact, centered, wraps
       to at most 2 lines, never a wide banner. */
    #heatBanner {
      position: fixed;
      left: 50%;
      top: calc(52px + var(--safe-top));
      transform: translateX(-50%) translateY(-6px);
      max-width: min(70vw, 300px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 7px 14px;
      font-family: "Roboto Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      line-height: 1.35;
      text-align: center;
      color: #D8A84E;
      background: rgba(22, 22, 29, 0.92);
      border: 1px solid #8a6a2e;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 42;
    }
    #heatBanner.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #heatBanner.critical {
      color: #FF6E5A;
      border-color: #a53a2a;
      background: rgba(44, 22, 19, 0.9);
      animation: heatPulse 1.1s ease-in-out infinite;
    }
    #heatBannerTime {
      font-weight: bold;
      font-size: 13px;
    }
    @keyframes heatPulse {
      0%, 100% { border-color: #a53a2a; }
      50% { border-color: #ff9a86; }
    }
    @media (prefers-reduced-motion: reduce) {
      #heatBanner.critical { animation: none; }
    }
    /* BURN pulse around the screen edge (user 2026-11-09): orange-red
       vignette glow while the hull runs hot — "we are burning". */
    #heatEdge {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 41;
      opacity: 0;
      box-shadow: inset 0 0 90px 34px rgba(232, 84, 32, 0.55), inset 0 0 30px 6px rgba(255, 128, 64, 0.35);
      transition: opacity 0.3s ease;
    }
    #heatEdge.active {
      animation: heatEdgePulse 0.9s ease-in-out infinite;
    }
    @keyframes heatEdgePulse {
      0%, 100% { filter: brightness(0.85); }
      50% { filter: brightness(1.25); }
    }
    @media (prefers-reduced-motion: reduce) {
      #heatEdge.active { animation: none; }
    }
    /* Object info card (user 2026-11-09): pinned just ABOVE the map square,
       exactly the square's width, so it never overlaps it nor the buttons.
       Two-block grid: everything fits (label above value, 2 columns). */
    #objectInfo {
      position: fixed;
      left: 50%;
      bottom: calc(50% + min(39vmin, 230px) - 24px);
      width: min(78vmin, 460px); /* exactly the map square's width */
      max-height: 150px;
      overflow: hidden;
      box-sizing: border-box;
      padding: 10px 14px;
      font-family: "Roboto Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--color-Console);
      background: rgba(22, 22, 29, 0.94);
      border: 1px solid var(--color-Eigengrau3);
      border-radius: 10px;
      z-index: 46;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    #objectInfo.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    #objectInfoTitle {
      color: #B7B7FF;
      font-size: 12px;
      margin-bottom: 2px;
    }
    #objectInfoType {
      color: var(--color-Eigengrau4);
      margin-bottom: 8px;
    }
    #objectInfoRows {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 20px;
      margin: 0;
    }
    #objectInfoRows div {
      padding: 3px 0 5px;
      border-top: 1px solid rgba(60, 60, 76, 0.35);
    }
    #objectInfoRows dt, #objectInfoRows dd { display: block; }
    #objectInfoRows dt {
      color: var(--color-Eigengrau4);
      font-size: 9px;
      letter-spacing: 0.12em;
      margin-bottom: 1px;
    }
    #objectInfoRows dd { margin: 0; color: var(--color-Console); font-size: 12px; }
    #objectInfoClose {
      position: absolute;
      top: 6px;
      right: 8px;
      width: 20px;
      height: 20px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--color-Eigengrau4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #objectInfoClose svg { display: block; }
    #objectInfoClose:hover { color: var(--color-Console); }
    #radarTitle {
      position: absolute;
      top: calc(18px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      color: var(--color-Eigengrau4);
      font-family: "Roboto Mono", monospace;
      font-size: 14px;
      letter-spacing: 0.22em;
    }
    @media (prefers-reduced-motion: reduce) {
      #radarOverlay { transition: opacity 0.01s linear, visibility 0s; }
    }

    /* Full-screen pause overlay with a frosted-glass blur, darkening and a
       subtle white pulse for atmosphere. Fades in smoothly (transition, not
       display toggling) вЂ” the same fade logic will be used for every menu. */
    #pauseMenu {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(10, 10, 16, 0.62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 50;
      user-select: none;
      -webkit-user-select: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.28s ease, visibility 0s linear 0.28s;
      overflow: hidden;
    }

    #pauseMenu.pause-open {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.28s ease;
    }

    /* Atmosphere: soft white pulses spawned by JS at random places and random
       times (asynchronous). They may sit partially off-screen on purpose. */
    .pause-pulse {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      --pulse-max: 1;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0) 66%);
      animation: pausePulseFade 2.8s ease-in-out forwards;
    }

    @keyframes pausePulseFade {
      0% { opacity: 0; transform: scale(0.7); }
      45% { opacity: calc(var(--pulse-max) * 1); transform: scale(1.06); }
      100% { opacity: 0; transform: scale(1.22); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pause-pulse { display: none; }
      #pauseMenu { transition: opacity 0.01s linear, visibility 0s; }
      #boostGlow { transition: opacity 0.01s linear; }
    }

    .pause-menu-title {
      font-size: 22px;
      letter-spacing: 8px;
      color: var(--color-Eigengrau4);
      margin: 0 0 18px 0;
    }

    .pause-menu-btn {
      width: 240px;
      padding: 12px;
      text-align: center;
      background: rgba(41, 41, 54, 0.85);
      border: 1px solid var(--color-Eigengrau3);
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 2px;
      font-size: 14px;
      transition: background 0.15s, border-color 0.15s;
    }

    .pause-menu-btn:hover {
      background: rgba(60, 60, 76, 0.95);
      border-color: var(--color-Eigengrau4);
    }

    #pauseContinue {
      border-color: var(--color-Autopilot);
    }

    .top-container {
      position: fixed;
      top: 0;
      left: 0;
      /* Hug the telemetry text: the collision logic for the pause button
         measures this box, so it must wrap tightly around the text. */
      width: fit-content;
      max-width: calc(100% - 70px);
      margin: 8px;
      pointer-events: none;
    }

    .bottom-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      margin: 8px;
      pointer-events: none;
    }

    .top-right-container {
      position: fixed;
      top: 0;
      right: 0;
      margin: 8px;
    }

    .bottom-right-container {
      position: fixed;
      bottom: 0;
      right: 0;
      margin: 8px;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s linear 0.2s, opacity 0.2s;
    }

    .bottom-right-container.controls-show {
      visibility: visible;
      opacity: 1;
      transition: visibility 0s linear 0s, opacity 0s;
    }

    .autopilot-button {
      padding: 8px;
      color: var(--color-Console);
      border: 1px solid var(--color-Eigengrau2);
      background: var(--color-Eigengrau2);
      border-radius: 4px;
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    .autopilot-button.autopilot-button-selected {
      background: var(--color-Autopilot);
      color: white;
    }

    .autopilot {
      color: var(--color-Autopilot);
      white-space: pre-wrap;
    }

    .loading {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      background: var(--color-Eigengrau);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Roboto Mono', monospace;
      font-size: 16px;
      color: var(--color-Console);
    }

    .loading[hidden] {
      display: none;
    }

    select, input[type="checkbox"], button {
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      color: var(--color-Console);
      background: var(--color-Eigengrau2);
      border: 1px solid var(--color-Eigengrau2);
    }

    label {
      font-size: 12px;
    }

    #speedContainerMask {
      background-color: rgba(0, 0, 0, 0.5);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
    }

    /* class selectors must win over the #speedContainerMask base rule */
    .speed-container-hide {
      display: none !important;
    }

    .speed-container-show {
      display: flex;
    }

    #speedContainer {
      background: var(--color-Eigengrau);
      border: 1px solid var(--color-Eigengrau2);
      padding: 16px;
      border-radius: 8px;
    }

    #speedContainerButton {
      text-align: center;
    }

    #speedIntegral, #speedDecimal {
      display: grid;
      gap: 4px;
    }

    #speedIntegral { grid-template-columns: repeat(6, 1fr); }
    #speedDecimal { grid-template-columns: repeat(6, 1fr); }

    #speedIntegral button, #speedDecimal button {
      font-size: 14px;
      padding: 8px;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <canvas id="canvasMain" class="canvas fill" hidden></canvas>

  <!-- Boost burner screen glow (driven per frame; see MainActivity15). -->
  <div id="boostGlow" aria-hidden="true"></div>

  <!-- Collision warning banner (driven per frame; see MainActivity15). -->
  <div id="impactWarning" role="alert" aria-live="assertive">
    <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M9 2 L16.5 15 H1.5 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="9" y1="6.5" x2="9" y2="10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="9" cy="12.8" r="0.9" fill="currentColor"/>
    </svg>
    <span>IMPACT</span>
    <span id="impactWarningTime">Tв€’0.0s</span>
  </div>

  <div id="topContainer" class="top-container" hidden>
    <div id="topText" class="container-text"></div>
    <div id="autopilotText" class="container-text autopilot"></div>
  </div>

  <div id="bottomContainer" class="bottom-container" hidden>
    <div id="bottomText" class="container-text"></div>
  </div>

  <div id="rightContainer" class="bottom-right-container">
    <select id="zoomSelect">
      <option>Fixed</option>
      <option>Dynamic</option>
      <option>Manual</option>
    </select>
    <label>
      <input type="checkbox" id="pauseCheck" />
      Pause
    </label>
    <button id="speedButton">1x</button>
  </div>

  <div id="loading" class="loading">Loading...</div>

  <!-- Player pause button: two rounded bars only вЂ” the orbit ring is gone,
       leaving just the square button itself (user 2026-11-09). -->
  <button id="pauseButton" type="button" aria-label="Pause">
    <svg width="32" height="32" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="6.6" y="5.4" width="3.2" height="11.2" rx="1.6" fill="#B7B7FF" />
      <rect x="12.2" y="5.4" width="3.2" height="11.2" rx="1.6" fill="#B7B7FF" />
    </svg>
  </button>

  <!-- Landing / interaction (user 2026-11-09): appears near a body; the
       tap runs a smooth AUTOMATIC touchdown (brake, approach, descend).
       Takes over like the safety shield while running. -->
  <button id="landButton" type="button" aria-label="Land">
    <svg width="26" height="26" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="12" cy="12" r="8.6" fill="none" stroke="#7A7A9E" stroke-width="1.4"/>
      <path d="M12 5 V14" stroke="#B7B7FF" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M8.4 11 L12 14.6 L15.6 11" fill="none" stroke="#B7B7FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="6" y1="18.6" x2="18" y2="18.6" stroke="#7A7A9E" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Boost burner (user 2026-11-08): sits under the pause button, thumb-
       reachable in the top-right stack. Enabled only at/above the 4000
       cruise cap; pushes the cap to 6000 while held. Bespoke flame glyph. -->
  <button id="boostButton" type="button" aria-label="Boost">
    <svg width="26" height="26" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 21 C9.5 18.5 9 15.5 11.1 13 C10.2 13.6 8.6 13.4 7.9 12.3 C6.4 9.9 8.4 6.6 9.9 4.2 C10.6 6 12 7 13 6.4 C14.2 5.6 13.8 3.8 14 2.2 C16.2 4.3 18 7 17.9 11 C17.8 15.4 14.6 19.4 12 21 Z" fill="#B7B7FF" stroke="#3C3C4C" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M12 18.7 C10.9 17.1 11 15.1 12.2 13.3 C13.5 15.1 13.3 17.1 12 18.7 Z" fill="#16161D"/>
      <path d="M8.8 21.3 Q12 23.5 15.2 21.3" fill="none" stroke="#8F8FD8" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Scanner (above boost): emits an area pulse that reveals bodies. -->
  <button id="scanButton" type="button" aria-label="Scan">
    <svg width="26" height="26" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="12" cy="12" r="3" fill="#B7B7FF"/>
      <path d="M12 5.6 A6.4 6.4 0 0 1 18.4 12" fill="none" stroke="#B7B7FF" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M12 2.4 A9.6 9.6 0 0 1 21.6 12" fill="none" stroke="#7A7A9E" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M12 18.4 A6.4 6.4 0 0 1 5.6 12" fill="none" stroke="#B7B7FF" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M12 21.6 A9.6 9.6 0 0 1 2.4 12" fill="none" stroke="#7A7A9E" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Radar / system map (above scan): schematic system view. The radar IS
       the autopilot map now вЂ” the old autopilot button under pause is gone
       (user 2026-11-09: two autopilots в†’ one). -->
  <button id="safeButton" type="button" aria-label="Safety system">
    <svg width="26" height="26" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 2.6 L20 5.2 V11 C20 16.6 16.4 19.8 12 21.4 C7.6 19.8 4 16.6 4 11 V5.2 Z" fill="rgba(22,22,29,0.85)" stroke="#B7B7FF" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M12 8.4 L15.2 15.2 M12 8.4 L8.8 15.2 M9.9 12.4 H14.1" fill="none" stroke="#B7B7FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <button id="radarButton" type="button" aria-label="Radar">
    <svg width="30" height="30" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="none" stroke="#3C3C4C" stroke-width="1.4"/>
      <circle cx="12" cy="12" r="5.4" fill="none" stroke="#7A7A9E" stroke-width="1.3"/>
      <circle cx="12" cy="12" r="1.8" fill="#B7B7FF"/>
      <circle cx="17.2" cy="9.4" r="1.5" fill="#B7B7FF"/>
      <line x1="12" y1="12" x2="17.2" y2="9.4" stroke="#7A7A9E" stroke-width="1" stroke-dasharray="1.6 1.6"/>
    </svg>
  </button>

  <!-- Radar / system map overlay: schematic view, shared with autopilot.
       Closes ONLY via the вњ• button above the map's top-right corner. -->
  <div id="radarOverlay" role="dialog" aria-label="System radar">
    <div id="radarTitle">SYSTEM RADAR</div>
    <canvas id="radarCanvas" width="560" height="560"></canvas>
    <!-- Route bar (user 2026-11-09 v4): FOUR identical square buttons вЂ”
         ADD node (pick mode) / DELETE node (click-to-delete mode) /
         CONFIRM (checkmark, launch, GREEN) / CLOSE radar (вњ•, bottom right;
         the only close affordance вЂ” the old top cross and the red cancel
         button are gone). -->
    <div id="routeBar">
      <button id="routeAdd" class="radar-square-btn" type="button" aria-label="Add route node">
        <svg width="30" height="30" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="10.4" cy="10.4" r="7.4" fill="none" stroke="#7A7A9E" stroke-width="1.4"/>
          <circle cx="10.4" cy="10.4" r="2" fill="#B7B7FF"/>
          <line x1="10.4" y1="1.6" x2="10.4" y2="6.4" stroke="#7A7A9E" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="10.4" y1="14.4" x2="10.4" y2="19.2" stroke="#7A7A9E" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="1.6" y1="10.4" x2="6.4" y2="10.4" stroke="#7A7A9E" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="14.4" y1="10.4" x2="19.2" y2="10.4" stroke="#7A7A9E" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="18.6" y1="21.4" x2="18.6" y2="15.8" stroke="#B7B7FF" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="15.8" y1="18.6" x2="21.4" y2="18.6" stroke="#B7B7FF" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="routeDel" class="radar-square-btn" type="button" aria-label="Delete node by click">
        <svg width="30" height="30" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="10.4" cy="10.4" r="7.4" fill="none" stroke="#7A7A9E" stroke-width="1.4"/>
          <circle cx="10.4" cy="10.4" r="2" fill="#B7B7FF"/>
          <line x1="10.4" y1="1.6" x2="10.4" y2="6.4" stroke="#7A7A9E" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="10.4" y1="14.4" x2="10.4" y2="19.2" stroke="#7A7A9E" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="1.6" y1="10.4" x2="6.4" y2="10.4" stroke="#7A7A9E" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="14.4" y1="10.4" x2="19.2" y2="10.4" stroke="#7A7A9E" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="15.8" y1="18.6" x2="21.4" y2="18.6" stroke="#B7B7FF" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="routeGo" class="radar-square-btn go-btn" type="button" aria-label="Launch route">
        <svg width="30" height="30" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="#4E9E5F" stroke-width="1.4"/>
          <path d="M7.6 12.4 L10.8 15.6 L16.4 8.6" fill="none" stroke="#9ED8A4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="routeClose" class="radar-square-btn" type="button" aria-label="Close radar">
        <svg width="30" height="30" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="#7A7A9E" stroke-width="1.4"/>
          <line x1="8.8" y1="8.8" x2="15.2" y2="15.2" stroke="#C6C6E8" stroke-width="2" stroke-linecap="round"/>
          <line x1="15.2" y1="8.8" x2="8.8" y2="15.2" stroke="#C6C6E8" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Scan feedback banners (top-center console strips). -->
  <div id="scanHint">SIGNAL TOO WEAK вЂ” SLOW BELOW <span id="scanHintNum">500</span> m/s</div>
  <div id="scanResult"></div>
  <div id="scanResults" aria-live="polite"></div>
  <div id="voidBanner"><span>INTO THE VOID</span><span>TURN BACK</span></div>
  <div id="voidBannerNear"><span>EDGE OF SYSTEM</span><span>TURN BACK</span></div>
  <div id="voidEdge" aria-hidden="true"></div>
  <div id="safeToast">CONTROL RETURNED</div>
  <div id="safeEdge" aria-hidden="true"></div>

  <!-- Stellar heat banner (amber warning в†’ red countdown, driven per frame). -->
  <div id="heatBanner" role="alert" aria-live="assertive">
    <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M8 1.4 C9.6 3.4 11 5 11 8.2 A3 3 0 0 1 5 8.2 C5 6.6 6 6 6.4 4.4 C7.2 5.2 7.8 5.4 8.2 4.6 C8.6 3.6 8.2 2.6 8 1.4 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      <line x1="4" y1="13.4" x2="12" y2="13.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    <span id="heatBannerText"></span>
    <span id="heatBannerTime"></span>
  </div>

  <!-- Object info card: click a body on the radar map. -->
  <div id="objectInfo" role="status">
    <button id="objectInfoClose" type="button" aria-label="Close info">
      <svg width="12" height="12" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <line x1="4" y1="4" x2="16" y2="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="16" y1="4" x2="4" y2="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <div id="objectInfoTitle">?</div>
    <div id="objectInfoType">?</div>
    <dl id="objectInfoRows"></dl>
  </div>

  <div id="pauseMenu" hidden>
    <div class="pause-menu-title">PAUSED</div>
    <button id="pauseContinue" class="pause-menu-btn" type="button">CONTINUE</button>
    <button id="pauseSettings" class="pause-menu-btn" type="button">SETTINGS</button>
    <button id="pauseExit" class="pause-menu-btn" type="button">EXIT</button>
  </div>

  <div id="speedContainerMask" class="speed-container-hide">
    <div id="speedContainer">
      <table>
        <tr>
          <td id="speedContainerButton">
            <button id="butIntegral">1</button>
            <button id="butDecimal">.00</button>
          </td>
        </tr>
        <tr>
          <td>
            <div id="speedIntegral"></div>
          </td>
        </tr>
        <tr>
          <td>
            <div id="speedDecimal"></div>
          </td>
        </tr>
      </table>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
